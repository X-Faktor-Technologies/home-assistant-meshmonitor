blueprint:
  name: MeshMonitor automation failure notification
  description: >-
    Notify a Home Assistant Companion App device when MeshMonitor reports a
    failed automation run associated with the selected source. Read configured
    automations and recent outcomes must be enabled for the integration.
  domain: automation
  source_url: https://github.com/X-Faktor-Technologies/home-assistant-meshmonitor/blob/main/blueprints/automation/meshmonitor/automation-failure-to-mobile-notification.yaml
  author: MeshMonitor
  input:
    source_device:
      name: Mesh source
      selector:
        device:
          filter:
            - integration: meshmonitor
              model: Meshtastic source
            - integration: meshmonitor
              model: MeshCore source
    notify_device:
      name: Device to notify
      selector:
        device:
          filter:
            integration: mobile_app

mode: queued
max: 5

triggers:
  - trigger: device
    device_id: !input source_device
    domain: meshmonitor
    type: automation_failed

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: MeshMonitor automation failed
    message: A MeshMonitor automation associated with the selected source failed.
