name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact new release tag (for example, v0.17.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml

  build:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "${GITHUB_SHA}" = "$(git rev-parse refs/remotes/origin/main)"
          test -z "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
      - name: Validate release metadata
        run: python scripts/repository_checks.py metadata --tag "${RELEASE_TAG}"
      - name: Build HACS archive
        run: python scripts/repository_checks.py build
      - name: Stage immutable release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload-${{ github.sha }}
          path: |
            meshmonitor.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download validated release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ github.sha }}
      - name: Create the exact validated tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.RELEASE_TAG}`,
              sha: context.sha,
            });
      - name: Attest HACS archive provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: meshmonitor.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            meshmonitor.zip
            SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
