name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build HACS archive
        run: |
          cd custom_components/meshmonitor
          zip -rD ../../meshmonitor.zip . \
            -x '*/__pycache__/*' '*.py[cod]' '.DS_Store'
      - uses: softprops/action-gh-release@v2
        with:
          files: meshmonitor.zip
          generate_release_notes: true
