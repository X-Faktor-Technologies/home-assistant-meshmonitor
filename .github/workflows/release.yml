name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release metadata
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/meshmonitor/manifest.json"))["version"])')"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
      - name: Build HACS archive
        run: |
          cd custom_components/meshmonitor
          zip -rD ../../meshmonitor.zip . \
            -x '*/__pycache__/*' '*.py[cod]' '.DS_Store'
          cd ../..
          unzip -t meshmonitor.zip
          for required in manifest.json __init__.py frontend/meshmonitor-panel.js; do
            unzip -Z1 meshmonitor.zip | grep -Fx "$required" >/dev/null
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: meshmonitor.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
