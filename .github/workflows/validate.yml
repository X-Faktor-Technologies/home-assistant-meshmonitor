name: Validate

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: ruff check custom_components scripts tests
      - run: mypy custom_components/meshmonitor
      - run: python -m compileall -q custom_components/meshmonitor
      - run: node --check custom_components/meshmonitor/frontend/meshmonitor-panel.js
      - run: node --test tests/frontend/*.test.mjs

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Check repository hygiene
        run: python scripts/repository_checks.py hygiene
      - name: Check release metadata
        run: python scripts/repository_checks.py metadata
      - name: Check relative documentation links
        run: python scripts/repository_checks.py links
      - name: Check documentation screenshots
        run: python scripts/repository_checks.py screenshots
      - name: Lint Markdown
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx --no-install markdownlint-cli2

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
